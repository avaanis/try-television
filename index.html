<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordle</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  <h1>WORDLE</h1>
  <div class="header-actions">
    <button id="hint-button" class="hint-button" type="button">HINT</button>
  </div>
</header>

<main>
  <section id="board" class="board" aria-label="Wordle game board"></section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="keyboard" class="keyboard" aria-label="On-screen keyboard"></section>

<section id="verification" class="verification" aria-live="assertive" aria-hidden="true">
  <p id="verification-text">VERIFYING...</p>
</section>

<section id="record" class="record" aria-hidden="true">
  <div class="record-content">
    <p class="record-eyebrow">CLASSIFIED // EYES ONLY</p>
    <h2>THIRDCOMM INTERNAL RECORD</h2>

    <div class="rule"></div>

    <h3>GUESS LOG</h3>

    <ol id="guess-log" class="guess-log"></ol>

    <p id="subject-note" class="subject-note"></p>

    <a class="archive-button"
       href="https://canva.link/ogadl70s5o96e46">
       ACCESS ARCHIVE
    </a>

  </div>
</section>

<section id="retry-modal" class="retry-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="retry-title">
  <div class="retry-panel">
    <h2 id="retry-title">Out of guesses</h2>
    <button id="retry-button" type="button">TRY AGAIN</button>
  </div>
</section>

<script src="script.js"></script>

</body>
</html>
